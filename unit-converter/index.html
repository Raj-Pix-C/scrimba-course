<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Unit Converter</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="index.css" />
    </head>

    <body>
        <div class="container">
            <div id="header">
                <h1>Metric/Imperial Unit Conversion</h1>
                <input id="ip" 
                    type="text" 
                    inputmode="decimal" 
                    pattern="^[0-9]+(\.[0-9]{1,2})?$"
                />
                <button id="conv-btn">Convert</button>
            </div>

            <div id="footer">
                <span class="conv-res" id="length"></span>
                <span class="conv-res" id="volume"></span>
                <span class="conv-res" id="mass"></span>
            </div>
        </div>

        <script src="index.js"></script>
    </body>
</html>
