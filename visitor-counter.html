<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Visitor Counter</title>
        <style>
            body{
                display: flex;
                flex-direction: column;
                justify-content: space-evenly;
                align-items: center;
                position: relative;
                text-align: center;
                height: 50vh;
                width: 50vw;
                margin: 0;
                padding: 20px;
                font-family: 'Inconsolata', 'Happy Monkey', monospace;
                color: #333;
                background-color: #f8f6f5;
            }
            body::before{
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width:100%;
                height: 100%;
                background-image: url("bhawal-national-park.jpeg");
                background-size: cover;
                opacity: 0.5;
                z-index: -1;
            }
            p header{ 
                font-size: 40px;
                text-shadow: 0 0 10px white;
                font-weight: bold;
            }
            #counter{
                display: block;
                font-size: 100px;
                text-shadow: 0 0 10px #f8f6f5;
                /* background: linear-gradient(45deg, white, grey); */
                font-weight: 600;
                border-bottom: 2px solid #333;
                border-top: 2px solid #333;
                /* margin-bottom: 20px; */
            }
            #inc-btn, #save-btn, #reset-btn{
                display:flex;
                float: left;
                /* margin: 10px; */
                padding: 8px 16px;
                font-size: 18px;
                border: 1.5px solid #333;
                color: #000;
                border-radius: 24px;
                background: transparent;
            }
        </style>
    </head>

    <body>
        <p id="header">Visitor Entered the park</p>
        <span id="counter"></span>
        <button id="inc-btn" onclick="increment()">Increment</button>
        <button id="save-btn" onclick="save()">Save</button>
        <button id="reset-btn" onclick="errormsg()">Reset</button>
        <p id="prev-saves">Previous saves: </p>
        <p id="error"></p>
    </body>
    <script src="script.js"></script>
</html>
