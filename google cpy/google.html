<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Google</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <style>
            .main{
                max-width: 600px;
                margin: 0 auto;
                width: 100%;
                /* align-items: center; */
                /* text-align: center; */
                /* display: flex; */
                /* flex-direction: column; */
            }
            .logo{
                display: block;
                margin: 20px auto;
                padding-top: 130px;
                max-width: 100%;
                width: 60%;
                height: auto;
            }
            .search-box{
                display:block;
                width: 400px;
                line-height: 24px; 
                margin-left: auto;
                margin-right: auto;
                /* margin-top: 20px;
                margin-bottom: 20px; */
                padding: 10px 30px 10px 30px;
                border: 1px solid #dfe1e5;
                border-radius: 24px;
            }
            .btn-wrapper{
                display: flex;
                justify-content: center;
            }
            .google-search-btn{
                height: 36px;
                min-width: 54px;
                background-color: #dfe1e5;
                margin : 31px 4px;
                padding: 0px 16px;
                border-radius: 8px;
                border: none;
                color: #3c4043;
                font-family: Google Sans, Arial, sans-serif;
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
                /* text-align: center; */
                user-select: none;
            }
            .feeling-lucky-btn{
                height: 36px;
                min-width: 54px;
                background-color: #dfe1e5;
                margin : 31px 4px;
                padding: 0px 16px;
                border-radius: 8px;
                border: none;
                color: #3c4043;
                font-family: Google Sans, Arial, sans-serif;
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
                /* text-align: center; */
                user-select: none;
            }
        </style>
    </head>
    <body>
        <div class="main">
            <img class="logo" src="google.png" alt="Google Logo">
            <input class="search-box" type="text">
            <div class="btn-wrapper">
                <button class="google-search-btn">Google Search</button>
                <button class="feeling-lucky-btn">I'm Feeling Lucky</button>
            </div>
        </div>
    </body>
</html>
