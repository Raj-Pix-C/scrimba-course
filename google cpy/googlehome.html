<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>google</title>
        <link rel="stylesheet" href="googlecss.css">
    </head>
    <body>
        <div class="header">
            <div class="blank-box"></div>
            <div class="gmail-shrt">Gmail</div>
            <div class="image-shrt">Images</div>
            <div class="search-labs">Labs</div>
            <div class="google-apps">Apps</div>
            <div class="google-acc">Acc</div>
        </div>
        <div class="google-home">
            <div class="google-logo-box">
                <div class="google-logo">
                    <a href="https://www.google.com" target="_blank">
                    <img src="google.png" width="270px" height="83px" alt="Google Logo">
                    </a>
                </div>
            </div>  
                      
            <br>

            <div class="search-box">
                <div class="search-icon"></div>
                <input type="search" name="inputbox" class="text-input-box">
                
                <div class="search-bar-sub-group">
                    <div class="voice-and-img-search">
                        <div class="voice-search"></div>
                        <div class="image-search"></div>
                    </div>
                    <div class="ai-mode"></div>
                </div>
                
                <!-- <input type="button" value="Search🔍"> -->
            </div>
            <br>
            <div class="two-buttons">
                <button class="gs">Google Search</button>
                <button class="fl">I'm Feeling Lucky</button>
            </div>
        </div>
        
    </body>
</html>
