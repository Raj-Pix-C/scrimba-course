<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Space Exploration</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
        <style>
            body{
                display: flex;
                flex-direction: column;
                /* max-width: 450px;                 */
                color: #82a5ca;
                
                font-family: nasalization, orbitron, sans-serif;
                margin: 0;
            }

            #spcxlg{
                display: block;
                src: url("spacex.png");
                margin: 0px auto;
                width: 185px;
            }

            .hero{
                display: flex;
                flex-direction: column;
                width: 100%;
                padding: 10px 0 40px 0;
                /* height: 180px; */
                /* background-image: url("guillermo-ferla-Oze6U2m1oYU-unsplash.jpg"); */
                background-image: url("https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExeGU3Y2U1anRqb29hOHY0N3h2YW9lY2x0djZueDNnbTUzeW8wam1jaiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/iicDrNGWxHmDrIni6j/giphy.gif");
                background-size: cover;
            }

            .pgtitle{
                text-align: center;
                margin: 0 auto 22px auto;
                text-shadow: 0px 0px 4px black;
            }

            .underline{
                border-bottom:#fff 4px solid;
                text-shadow: 1px 1px ;
                text-shadow: inherit;
            }

            .apbtn{
                font-family: inherit;
                font-weight: 900;
                margin: 0px auto;
                /* line-height: 20px; */
                border-radius: 0px;
                border: none;
                padding: 6px 12px;
                color: #82a5ca;
                
                background-color: #fff;
            }

            .footer{
                display: flex;
                flex-direction: column;
                border: none;
                width: 100%;
                margin: 0;
                text-align: center;
                background-color: #fff;
            }
            
            /* .orbitron {
                font-family: "Orbitron", sans-serif;
                font-optical-sizing: auto;
                font-weight: 400;
                font-style: normal;
            } */

            @font-face{
                src: url("Nasalization\ Rg.otf");
                font-family: nasalization;
            }
            .nasalization{
                font-family: nasalization, monospace;
                font-optical-sizing: auto;
                font-weight: 400;
                font-style: normal;
            }
        </style>
    </head>
    <body>
        <div class="hero">
            <img id="spcxlg" src="spacex.png" alt="SpaceX Logo">
            <h1 class="pgtitle">Join the 
                <span class="underline">
                    exploration
                </span>
            </h1>
            <button class="apbtn">Apply</button>
        </div>
        
        <div class="footer">
            <h3>
                Terms and condition apply
            </h3>
        </div>
        
    </body>
</html>
