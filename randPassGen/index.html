<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Random Password Generator</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="index.css" />
    </head>

    <body>
        <div class="container">
            <h1 id="title">Generate a</h1>
            <h1 id="title2">random password</h1>
            <h3 id="sub-title">Never use an insecure password again</h3>
            <div class="btn-container">
                <div id="what">
                    <button id="rand-pass-gen-btn" class="btn">Generate passwords</button>
                    
                </div>
                <div id="what">
                    <input type="radio" id="l8" name="len" value="8">
                    <label for="l8">Len 8</label>
                    <br>
                    <input type="radio" id="l16" name="len" value="16">
                    <label for="l16">Len 16</label>
                    <br>
                    <input type="radio" id="l32" name="len" value="32">
                    <label for="l32">Len 32</label>
                    <br>
                </div>
                <div id="options">
                    <input type="checkbox" id="include-symbols" name="include-symbols" value="symbols"/>
                    <label for="include-symbols">Include symbols</label>
                    <br>
                    <input type="checkbox" id="include-numbers" name="include-numbers" value="numbers"/>
                    <label for="include-numbers">Include numbers</label>
                </div>
                <span id="separator"></span>
                <div id="passwords-container">
                    <button id="gen1-btn" class="btn"></button>
                    <button id="gen2-btn" class="btn"></button>
                </div>
                
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
