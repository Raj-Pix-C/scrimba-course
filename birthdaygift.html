<!DOCTYPE html>
<html lang="en">
    <head>
        
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Birthday Gift</title>
        <style>
            @font-face{
                font-family: happy-monkey;
                src: url("HappyMonkey-Regular.ttf");
            }
            body{
                display: flex;
                flex-direction: column;
                font-family: happy-monkey;
                text-align: center;
                align-items: center;
                color: #fff;
                /* background-color: #a2d2ff; */
                background: linear-gradient(135deg, #a2d2ff, #efb0c9);
            }
            #header{
                display:flex;
                flex-direction: column;
                justify-content: start;
                align-items: center;
            }
            #pfp{
                display: block;
                width: 185px;
                height: 185px;
                border-radius: 50%;
                border: 4px solid #efb0c9;
                text-align: center;
            }
            h1, h2, h4{
                text-shadow: 1px 1px 1px black;
            }
            /* h4{
                b
            } */
            
            .pink-bg{
                background-color: #efb0c9;
                margin: 5px;
                padding: 5px 10px;
                border-radius: 5px 10px;
            }

            .gift-section{
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                margin: 0 10px;
                text-shadow: 1px 1px 1px black;
            }
            #gift1{
                display: flex;
                justify-content: center;
                align-items: center;
                width:400px; 
                height:400px; 
                border: 4px solid #fff;
                border-radius:10px;
                background-image: url("google.png");
                background-size: cover;
                background-color: #efb0c9;
            }
            #gift1:hover{
                transform: scale(0.95);
                transition: transform 0.3s ease-in-out;
                background-color: #ffb6c1;
                background-image: url("google.png");
                background-size: cover;
            }
            #gift2{
                display: flex;
                justify-content: center;
                align-items: center;
                width:400px; 
                height:400px; 
                border: 4px solid #fff;
                border-radius:10px;
                background-image: url("spacex.png");
                background-size: cover;
                background-color: #efb0c9;
            }
            #gift2:hover{
                transform: scale(0.95);
                transition: transform 0.3s ease-in-out;
                background-color: #ffb6c1;
                background-image: url("spacex.png");
                background-size: contain;
            }
            .gift-msg{
                font-size: 2rem;
                margin: 60px 0 10px 0;
            }
            .gift-desc{
                /* font-size: 1.5rem; */
                margin: 60px 0 10px 0;
            }
            .gift-hint{
                /* font-size: 1.2rem; */
                margin: 5px 0;
            }
            #footer{
                display:flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                margin: 20px 0 0 0;
                font-style: italic;
            }
            #footer-note1{
                margin: 5px 0;
            }
            #footer-note2{
                margin: 5px 0;
                /* border-bottom: 2px solid #fff; */
            }
            a{
                color: #fff;
            }
        </style>
    </head>
    <body>
        <div id="header">
            <h1>Today is omuks birthday!</h1>
            <img id="pfp" src="birthday.jpg" alt="omuks picture">
            <h2>Happy birthday omuk!</h2>
            <h4 class="pink-bg">x years old</h4>
            <h4 class="pink-bg">01.11.2026</h4>
        </div>
        
        <div class="gift-section">
            <!-- <h2 class="gift-msg">Birthday Gift</h2> -->
            <h3 class="gift-desc">Here is a special gift for you, omuk! 🎁</h3>
            <h3 class="gift-hint">(Hover over to see more!)</h3>
            
            <div id="gift1"></div>
        </div>
        <div class="gift-section">
            <!-- <h2 class="gift-msg">Birthday Gift</h2> -->
            <h3 class="gift-desc">Here is another special gift for you, omuk! 🎁</h3>
            <!-- <h3 class="gift-hint">(Hover over to see more!)</h3> -->
            
            <div id="gift2"></div>
        </div>
        <div id="footer">
            <h4 class="pink-bg">Made with ❤️ by your friend</h4>
            <p id="footer-note1">Hope you liked it!</p>
            <p id="footer-note2"><a href="#" target="_blank">see you next year!</a></p>
        </div>
    </body>
</html>
